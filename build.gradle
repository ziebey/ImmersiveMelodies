plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19' apply false
    id 'net.neoforged.moddev' version '2.0.144' apply false
}

// Gradle 9 removed Project.exec(); providers.exec() is the supported replacement.
def getAppVersion = { ->
    def fallback = "${rootProject.mod_version}+${rootProject.minecraft_version}".toString()
    try {
        def output = providers.exec {
            commandLine 'git', 'tag', '--points-at', 'HEAD'
            ignoreExitValue = true
        }
        if (output.result.get().exitValue != 0) {
            return fallback
        }
        def tag = output.standardOutput.asText.get().trim()
        return tag.isEmpty() ? fallback : tag
    } catch (Exception e) {
        println "Warning: could not determine version from git (${e.message}), using ${fallback}"
        return fallback
    }
} as Object

allprojects {
    version = getAppVersion()
}
